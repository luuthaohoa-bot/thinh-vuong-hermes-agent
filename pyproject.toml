[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thinh-vuong-hermes-agent"
version = "0.1.0"
description = "Review-first offline sales workflow for Thinh Vuong"
requires-python = ">=3.11"
dependencies = ["pypdf>=5,<7", "pdfplumber>=0.11,<1", "openpyxl>=3.1,<4"]

[project.scripts]
hermes = "hermes.cli:main"

[tool.setuptools.packages.find]
include = ["hermes*"]
